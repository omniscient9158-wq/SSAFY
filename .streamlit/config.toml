[theme]
base = "light"
primaryColor = "#1F6F8B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F7F9"
textColor = "#1B2B34"
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.sidebar]
backgroundColor = "#F2F7F9"
secondaryBackgroundColor = "#E9EFF3"
textColor = "#1B2B34"
borderColor = "#D6E0E6"
